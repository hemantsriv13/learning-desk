[server]
# Only reachable from this computer.
address = "localhost"
port = 8501
# Serves ./static (the bundled typeface and the logo) so the app needs no font CDN.
enableStaticServing = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
# Hide Streamlit's "Deploy" button; this app is meant to stay local.
toolbarMode = "minimal"

[theme]
# Black page with graphite cards (ground #050505, panels #2a2a2a, card edge #4a4a4a).
# Mint marks data, progress and the one primary action.
base = "dark"
primaryColor = "#3ddc97"
backgroundColor = "#050505"
secondaryBackgroundColor = "#2a2a2a"
textColor = "#f0f0f0"
linkColor = "#f0f0f0"
borderColor = "#444444"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "14px"
buttonRadius = "full"
font = "Inter, system-ui, sans-serif"
headingFont = "Space Grotesk, Inter, system-ui, sans-serif"
headingFontSizes = ["2rem", "1.5rem", "1.25rem"]
headingFontWeights = [600, 600, 600]
# Accents for the one highlighted phrase in a review (mint; amber for "One thing to clarify").
# Both are well over 7:1 against backgroundColor.
blueTextColor = "#7fe8b9"
orangeTextColor = "#ffb347"

[[theme.fontFaces]]
# Inter (body text), SIL Open Font License 1.1 (static/fonts/Inter-OFL.txt). One variable file, Latin subset.
family = "Inter"
url = "app/static/fonts/Inter-latin.woff2"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
# Space Grotesk (headings), SIL Open Font License 1.1 (static/fonts/SpaceGrotesk-OFL.txt). Variable, Latin subset.
family = "Space Grotesk"
url = "app/static/fonts/SpaceGrotesk-latin.woff2"
weight = "400 700"
style = "normal"

[theme.sidebar]
backgroundColor = "#121212"
secondaryBackgroundColor = "#2a2a2a"
